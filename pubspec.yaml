name: sonar_notes
description: "Cross-platform application for audio recording, transcription, and smart notes."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Audio & Speech-to-Text
  record: ^5.2.1
  audioplayers: ^6.0.0
  whisper_ggml_plus: ^1.5.2

  # Local Database
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.4+1
  path_provider: ^2.1.3
  path: ^1.9.0

  # State Management
  flutter_riverpod: ^2.5.1

  # Utility & UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Testing & Dev
  mocktail: ^1.0.4
  build_runner: ^2.4.9

dependency_overrides:
  record_linux: 1.3.1

flutter:
  uses-material-design: true
